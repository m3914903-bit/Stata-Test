<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading OS | ROMAN ANKUDINOV</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;900&display=swap');
        :root { --bg: #020617; --card: #0f172a; --accent: #3b82f6; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #f1f5f9; margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; }
        .glass-card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .pnl-numbers { font-family: 'JetBrains Mono', monospace; }
        input { background: #1e293b; border: 1px solid #334155; color: #ffffff; padding: 0 12px; border-radius: 8px; font-weight: 700; width: 100%; height: 42px; outline: none; }
        label { color: #94a3b8; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; display: block; }
        
        /* Сетка */
        .main-layout { 
            display: grid; 
            grid-template-columns: 450px 1fr; /* Увеличил ширину левой колонки до 450px */
            gap: 16px; 
            min-height: calc(100vh - 160px); 
            align-items: stretch;
        }

        /* Левая колонка теперь флекс-контейнер на всю высоту */
        #individual-charts { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            height: 100%; 
        }

        /* Карточки активов растягиваются равномерно */
        .asset-card { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            padding: 1rem 1.5rem;
            min-height: 100px; 
        }

        .chart-section { padding: 24px; }
    </style>
</head>
<body class="p-4">
    <header class="w-full flex flex-col lg:flex-row justify-between items-center gap-6 mb-4 p-6 glass-card">
        <div class="flex items-center gap-6 w-full lg:w-auto justify-between lg:justify-start">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white uppercase leading-none">ROMAN ANKUDINOV</h1>
                <p class="text-[10px] text-slate-500 font-bold mt-1 tracking-[0.2em]">QUANTITATIVE ANALYSIS TERMINAL</p>
            </div>
            <div class="flex gap-3 items-center bg-black/30 p-2 px-4 rounded-lg border border-white/5">
                <span id="startDate" class="text-xs text-blue-400 font-bold pnl-numbers">-- ---</span>
                <span class="text-slate-700">/</span>
                <span id="endDate" class="text-xs text-blue-400 font-bold pnl-numbers">-- ---</span>
            </div>
        </div>
        <div class="flex flex-wrap justify-center lg:justify-end gap-8 items-center w-full lg:w-auto">
            <div class="flex gap-4 items-end">
                <div class="flex flex-col w-32">
                    <label>Начальный Депозит</label>
                    <input type="number" id="depositInput" value="1000" class="pnl-numbers">
                </div>
                <div class="flex flex-col w-24">
                    <label class="text-yellow-500">Риск %</label>
                    <input type="number" id="riskInput" value="1" step="0.1" class="pnl-numbers text-yellow-500 text-center">
                </div>
            </div>
            <div class="h-12 w-[1px] bg-white/10 hidden xl:block"></div>
            <div class="flex gap-10">
                <div class="text-right">
                    <p class="text-[10px] text-red-400 uppercase font-bold mb-1">Max Drawdown</p>
                    <p id="maxDD" class="text-2xl font-black text-red-500 pnl-numbers">0%</p>
                </div>
                <div class="text-right border-l border-white/10 pl-10">
                    <p class="text-[10px] text-emerald-400 uppercase font-bold mb-1">Final Balance</p>
                    <p id="finalBalance" class="text-2xl font-black text-emerald-400 pnl-numbers">$ 0</p>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <aside id="individual-charts"></aside>

        <main class="space-y-4 flex flex-col">
            <section class="glass-card chart-section flex-1">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-black text-white uppercase tracking-tight">Efficiency (R)</h3>
                    <div id="rTotal" class="pnl-numbers text-blue-400 font-bold text-xl bg-blue-500/10 px-6 py-2 rounded-lg border border-blue-500/20">0 R</div>
                </div>
                <div class="h-[300px] w-full"><canvas id="simpleChart"></canvas></div>
            </section>

            <section class="glass-card chart-section flex-1 border-t-2 border-t-emerald-600/50">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-black text-emerald-400 uppercase tracking-tight">Growth ($)</h3>
                    <div id="roiPct" class="pnl-numbers text-emerald-400 font-bold text-xl bg-emerald-500/10 px-6 py-2 rounded-lg border border-emerald-500/20">+0% ROI</div>
                </div>
                <div class="h-[300px] w-full"><canvas id="compoundChart"></canvas></div>
            </section>

            <section class="glass-card chart-section border-t-2 border-t-slate-700">
                <h3 class="text-lg font-black text-white uppercase tracking-tight mb-4">Monthly Profitability</h3>
                <div class="h-[250px] w-full"><canvas id="monthlyChart"></canvas></div>
            </section>
        </main>
    </div>

    <script>
        window.addEventListener('load', () => {
            if (typeof marketData === 'undefined') return;

            const dataSet = marketData;
            const labels = dataSet.map(d => d.date.toUpperCase());
            const assets = Object.keys(dataSet[0]).filter(k => k !== 'date');
            const colors = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#f472b6', '#22d3ee', '#fb923c', '#c084fc', '#2dd4bf', '#818cf8'];

            let chartS, chartC, chartM;
            let sideCharts = {};

            function update() {
                const dep = parseFloat(document.getElementById('depositInput').value) || 0;
                const risk = (parseFloat(document.getElementById('riskInput').value) || 0) / 100;
                
                let sumR = 0, bal = dep, peak = dep, mdd = 0;
                const sData = [], cData = [];
                const monthlyStats = {};
                const assetTotals = {};
                assets.forEach(a => assetTotals[a] = []);

                dataSet.forEach((entry) => {
                    let dayR = 0;
                    assets.forEach(asset => {
                        const val = entry[asset] || 0;
                        dayR += val;
                        const lastTotal = assetTotals[asset].length > 0 ? assetTotals[asset][assetTotals[asset].length-1] : 0;
                        assetTotals[asset].push(lastTotal + val);
                    });

                    sumR += dayR;
                    sData.push(sumR.toFixed(2));
                    bal = bal * (1 + (dayR * risk));
                    cData.push(bal.toFixed(2));

                    if (bal > peak) peak = bal;
                    const dd = peak === 0 ? 0 : ((peak - bal) / peak) * 100;
                    if (dd > mdd) mdd = dd;

                    const month = entry.date.split(' ')[1];
                    monthlyStats[month] = (monthlyStats[month] || 0) + (dayR * risk * 100);
                });

                document.getElementById('finalBalance').innerText = '$ ' + Math.round(bal).toLocaleString();
                document.getElementById('roiPct').innerText = '+' + Math.round(((bal-dep)/dep)*100).toLocaleString() + '% ROI';
                document.getElementById('maxDD').innerText = Math.round(mdd) + '%';
                document.getElementById('rTotal').innerText = sumR.toFixed(1) + ' R';
                
                chartS.data.datasets[0].data = sData; 
                chartC.data.datasets[0].data = cData;
                chartM.data.labels = Object.keys(monthlyStats).map(m => m.toUpperCase());
                chartM.data.datasets[0].data = Object.values(monthlyStats).map(v => v.toFixed(1));
                chartM.data.datasets[0].backgroundColor = Object.values(monthlyStats).map(v => v >= 0 ? '#10b981' : '#ef4444');
                
                chartS.update(); chartC.update(); chartM.update();
                assets.forEach(asset => { if (sideCharts[asset]) { sideCharts[asset].data.datasets[0].data = assetTotals[asset]; sideCharts[asset].update(); } });
            }

            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: false },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.02)' }, ticks: { color: '#64748b', font: { size: 10 } } },
                    y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#94a3b8', font: { size: 11 } } }
                }
            };

            document.getElementById('startDate').innerText = labels[0];
            document.getElementById('endDate').innerText = labels[labels.length-1];

            chartS = new Chart(document.getElementById('simpleChart'), {
                type: 'line', data: { labels: labels, datasets: [{ borderColor: '#3b82f6', borderWidth: 3, pointRadius: 0, tension: 0.1, data: [] }] },
                options: commonOptions
            });

            chartC = new Chart(document.getElementById('compoundChart'), {
                type: 'line', data: { labels: labels, datasets: [{ borderColor: '#10b981', borderWidth: 3, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.05)', pointRadius: 0, tension: 0.1, data: [] }] },
                options: commonOptions
            });

            chartM = new Chart(document.getElementById('monthlyChart'), {
                type: 'bar', data: { labels: [], datasets: [{ data: [], borderRadius: 6 }] },
                options: { ...commonOptions, scales: { x: { ticks: { color: '#94a3b8' } }, y: { position: 'right', ticks: { callback: v => v + '%' } } } }
            });

            const side = document.getElementById('individual-charts');
            assets.forEach((asset, i) => {
                const card = document.createElement('div');
                card.className = 'glass-card asset-card gap-6 hover:border-white/20 transition-colors cursor-default';
                card.innerHTML = `
                    <div class="flex flex-col min-w-[80px]">
                        <span class="text-sm text-white font-black uppercase tracking-widest">${asset}</span>
                    </div>
                    <div class="flex-grow h-16 relative">
                        <canvas id="s-${asset}"></canvas>
                    </div>`;
                side.appendChild(card);

                sideCharts[asset] = new Chart(document.getElementById(`s-${asset}`), {
                    type: 'line', 
                    data: { labels: labels, datasets: [{ data: [], borderColor: colors[i % colors.length], borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
                    options: { 
                        responsive: true, maintainAspectRatio: false, plugins: { legend: false },
                        scales: { x: { display: false }, y: { display: false } } 
                    }
                });
            });

            update();
            ['depositInput', 'riskInput'].forEach(id => document.getElementById(id).addEventListener('input', update));
        });
    </script>
</body>
</html>
