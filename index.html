<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading OS | ROMAN ANKUDINOV</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;900&display=swap');
        
        :root { --bg: #020617; --card: #0f172a; --accent: #3b82f6; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: #f1f5f9; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .glass-card { 
            background: var(--card); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .pnl-numbers { font-family: 'JetBrains Mono', monospace; }
        
        input { 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: #ffffff; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-weight: 700;
        }

        label { color: #94a3b8; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }

        .chart-section { min-height: 450px; padding: 24px; }
        
        @media (max-width: 768px) {
            .main-layout { flex-direction: column !important; }
            .sidebar { width: 100% !important; order: 2; padding: 0 10px; }
            .content-area { width: 100% !important; order: 1; }
            .chart-section { min-height: 350px; padding: 15px; }
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

    <header class="max-w-7xl mx-auto w-full flex flex-col md:flex-row justify-between items-center gap-6 mb-8 p-6 glass-card">
        <div class="text-center md:text-left">
            <h1 class="text-2xl font-black tracking-tighter text-white uppercase leading-none">ROMAN ANKUDINOV</h1>
            <p class="text-[10px] text-slate-500 font-bold mt-1 tracking-[0.2em]">QUANTITATIVE ANALYSIS TERMINAL</p>
            <div class="flex gap-3 mt-4 items-center justify-center md:justify-start bg-black/20 p-2 rounded-lg w-fit">
                <span id="startDate" class="text-xs text-blue-400 font-bold pnl-numbers">-- ---</span>
                <span class="text-slate-700">/</span>
                <span id="endDate" class="text-xs text-blue-400 font-bold pnl-numbers">-- ---</span>
            </div>
        </div>
        
        <div class="flex flex-wrap justify-center gap-6 items-center">
            <div class="flex flex-col gap-1">
                <label>Initial Deposit</label>
                <input type="number" id="depositInput" value="1000" class="pnl-numbers w-32">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-yellow-500">Risk per R %</label>
                <input type="number" id="riskInput" value="1" step="0.1" class="pnl-numbers w-20 text-yellow-500 text-center">
            </div>
            <div class="h-12 w-[1px] bg-white/10 hidden md:block"></div>
            <div class="flex gap-8">
                <div class="text-right">
                    <p class="text-[10px] text-red-400 uppercase font-bold mb-1">Max Drawdown</p>
                    <p id="maxDD" class="text-2xl font-black text-red-500 pnl-numbers">0%</p>
                </div>
                <div class="text-right border-l border-white/10 pl-8">
                    <p class="text-[10px] text-emerald-400 uppercase font-bold mb-1">Current Balance</p>
                    <p id="finalBalance" class="text-2xl font-black text-emerald-400 pnl-numbers">$ 0</p>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 main-layout">
        
        <aside class="sidebar lg:w-1/4 space-y-4">
            <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest px-2 flex justify-between items-center">
                <span>Assets Meta</span>
                <span class="h-[1px] flex-grow ml-4 bg-white/10"></span>
            </h2>
            <div id="individual-charts" class="grid grid-cols-2 lg:grid-cols-1 gap-4"></div>
        </aside>

        <main class="content-area lg:w-3/4 space-y-8 pb-12">
            
            <section class="glass-card chart-section">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h3 class="text-lg font-black text-white uppercase tracking-tight">Trading Efficiency</h3>
                        <p class="text-xs text-slate-500 uppercase">Cumulative result in R-units</p>
                    </div>
                    <div id="rTotal" class="pnl-numbers text-blue-400 font-bold text-xl bg-blue-500/10 px-4 py-2 rounded-xl border border-blue-500/20">0 R</div>
                </div>
                <div class="h-[350px] w-full">
                    <canvas id="simpleChart"></canvas>
                </div>
            </section>

            <section class="glass-card chart-section border-t-4 border-t-blue-600">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h3 class="text-lg font-black text-white uppercase tracking-tight">Equity Growth</h3>
                        <p class="text-xs text-slate-500 uppercase">Compound interest simulation</p>
                    </div>
                    <div id="roiPct" class="pnl-numbers text-emerald-400 font-bold text-xl bg-emerald-500/10 px-4 py-2 rounded-xl border border-emerald-500/20">+0% ROI</div>
                </div>
                <div class="h-[400px] w-full">
                    <canvas id="compoundChart"></canvas>
                </div>
            </section>

            <section class="glass-card chart-section border-t-4 border-t-slate-700">
                <div class="mb-6">
                    <h3 class="text-lg font-black text-white uppercase tracking-tight">Monthly Performance</h3>
                    <p class="text-xs text-slate-500 uppercase">R-distribution by month</p>
                </div>
                <div class="h-[300px] w-full">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </section>

        </main>
    </div>

    <script>
        const rawDates = window.tradingData.dates;
        const data = window.tradingData.assets;
        const labels = rawDates.map(l => l + (['jan', 'feb', 'mar'].includes(l.split(' ')[1]) ? ' 26' : ' 25'));
        const colors = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#f472b6', '#22d3ee', '#fb923c', '#c084fc', '#2dd4bf', '#818cf8', '#f472b6'];
        let chartS, chartC, chartM;

        function update() {
            const dep = parseFloat(document.getElementById('depositInput').value) || 0;
            const risk = (parseFloat(document.getElementById('riskInput').value) || 0) / 100;
            let sumR = 0, bal = dep, peak = dep, mdd = 0;
            const sData = [], cData = [];
            const monthlyStats = {};

            labels.forEach((label, i) => {
                const dayR = Object.keys(data).reduce((s, k) => s + (data[k][i] || 0), 0);
                sumR += dayR; 
                sData.push(sumR.toFixed(2));
                
                // Математика сложного процента: Баланс * (1 + (R за день * Риск))
                bal = bal * (1 + (dayR * risk)); 
                cData.push(bal.toFixed(2));
                
                if (bal > peak) peak = bal;
                const dd = ((peak - bal) / peak) * 100;
                if (dd > mdd) mdd = dd;

                const parts = label.split(' ');
                const monthKey = parts[1] + ' ' + parts[2];
                monthlyStats[monthKey] = (monthlyStats[monthKey] || 0) + dayR;
            });

            document.getElementById('finalBalance').innerText = '$ ' + Math.round(bal).toLocaleString();
            document.getElementById('roiPct').innerText = '+' + Math.round(((bal-dep)/dep)*100).toLocaleString() + '% ROI';
            document.getElementById('maxDD').innerText = Math.round(mdd) + '%';
            document.getElementById('rTotal').innerText = sumR.toFixed(1) + ' R';
            
            chartS.data.datasets[0].data = sData; 
            chartC.data.datasets[0].data = cData;
            chartM.data.labels = Object.keys(monthlyStats);
            chartM.data.datasets[0].data = Object.values(monthlyStats);
            chartM.data.datasets[0].backgroundColor = Object.values(monthlyStats).map(v => v >= 0 ? '#10b981' : '#ef4444');

            chartS.update(); chartC.update(); chartM.update();
        }

        function init() {
            document.getElementById('startDate').innerText = labels[0].toUpperCase();
            document.getElementById('endDate').innerText = labels[labels.length-1].toUpperCase();
            
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: false },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } },
                    y: { position: 'right', grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#94a3b8', font: { size: 11 } } }
                }
            };

            chartS = new Chart(document.getElementById('simpleChart'), {
                type: 'line', 
                data: { labels: labels, datasets: [{ borderColor: '#3b82f6', borderWidth: 3, pointRadius: 0, tension: 0.1, data: [] }] },
                options: commonOptions
            });

            chartC = new Chart(document.getElementById('compoundChart'), {
                type: 'line', 
                data: { 
                    labels: labels, 
                    datasets: [{ 
                        borderColor: '#10b981', 
                        borderWidth: 3, 
                        fill: true, 
                        backgroundColor: 'rgba(16, 185, 129, 0.05)', 
                        pointRadius: 0, 
                        tension: 0.1,
                        data: [] 
                    }] 
                },
                options: commonOptions
            });

            chartM = new Chart(document.getElementById('monthlyChart'), {
                type: 'bar',
                data: { labels: [], datasets: [{ data: [], borderRadius: 6 }] },
                options: { ...commonOptions, scales: { ...commonOptions.scales, x: { display: true, ticks: { color: '#94a3b8' } } } }
            });

            const side = document.getElementById('individual-charts');
            Object.keys(data).forEach((k, i) => {
                const card = document.createElement('div');
                card.className = 'glass-card p-4 h-24 flex flex-col justify-between';
                card.innerHTML = `<div class="flex justify-between items-center"><span class="text-[10px] text-white font-black uppercase">${k}</span></div><div class="h-10"><canvas id="s-${k}"></canvas></div>`;
                side.appendChild(card);
                let s = 0;
                new Chart(document.getElementById(`s-${k}`), {
                    type: 'line', 
                    data: { labels: labels, datasets: [{ data: data[k].map(v => s+=v), borderColor: colors[i % colors.length], borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: false }, scales: { x: { display: false }, y: { display: false } } }
                });
            });
            
            update();
            ['depositInput', 'riskInput'].forEach(id => document.getElementById(id).addEventListener('input', update));
        }
        window.onload = init;
    </script>
</body>
</html>
